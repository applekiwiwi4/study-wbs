<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매일 할 일 WBS</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e4e4e0;
          --en:#2f6fdf; --ai:#1f9d6b; --ros:#c4612a; --done:#b5b5b0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --card:#202022; --ink:#ececee; --mute:#9a9aa0; --line:#333336; --done:#5a5a5e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:24px 16px 60px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--mute); margin-bottom:20px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0 2px; }
  .bar i { display:block; height:100%; background:var(--ai); width:0; transition:width .3s; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin:14px 0 18px; color:var(--mute); }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; color:#fff; font-size:12px; font-weight:600; }
  .en { background:var(--en); } .ai { background:var(--ai); } .ros { background:var(--ros); } .rev { background:#8a63c9; }
  .day.buffer { background:transparent; border-style:dashed; }
  .week { margin-top:22px; }
  .week h2 { font-size:15px; margin:0 0 8px; color:var(--mute); font-weight:600; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .day.today { border-color:var(--ai); box-shadow:0 0 0 2px color-mix(in srgb, var(--ai) 25%, transparent); }
  .day header { display:flex; justify-content:space-between; font-weight:600; margin-bottom:4px; }
  .day header span { color:var(--mute); font-weight:400; }
  label { display:flex; gap:8px; align-items:flex-start; padding:3px 0; cursor:pointer; }
  label input { margin-top:3px; }
  label.done .txt { color:var(--done); text-decoration:line-through; }
  details.lesson { margin:2px 0 6px 26px; border-left:3px solid var(--en); padding:2px 0 2px 12px; }
  details.lesson summary { cursor:pointer; color:var(--en); font-weight:600; }
  details.lesson h4 { margin:10px 0 4px; font-size:13px; color:var(--mute); }
  details.lesson table { border-collapse:collapse; width:100%; }
  details.lesson td { border-top:1px solid var(--line); padding:4px 6px; vertical-align:top; }
  details.lesson td:first-child { font-weight:600; white-space:nowrap; }
  details.lesson a { color:var(--en); }
  .quiz { margin:6px 0; }
  .quiz button { font:inherit; margin:3px 4px 0 0; padding:3px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; }
  .quiz button.ok { background:#1f9d6b; border-color:#1f9d6b; color:#fff; }
  .quiz button.no { background:#d0473a; border-color:#d0473a; color:#fff; }
  .dialog { white-space:pre-line; }
  .flip { cursor:pointer; }
  .flip td:nth-child(2) { color:transparent; background:var(--line); border-radius:4px; }
  .flip.show td:nth-child(2) { color:inherit; background:none; }
  .txt small { color:var(--mute); }
  a.open { display:inline-block; margin-left:4px; padding:0 7px; border:1px solid var(--line); border-radius:9px;
           font-size:12px; color:var(--mute); text-decoration:none; white-space:nowrap; }
  a.open:hover { color:var(--ink); border-color:var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <h1>매일 할 일 WBS</h1>
  <div class="sub"><span id="range"></span> · 체크하면 이 브라우저에 저장돼요</div>
  <div>전체 진행률 <b id="pct">0%</b></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="legend">
    <span><span class="tag en">EN</span> 생활영어 30분</span>
    <span><span class="tag ai">AI</span> AI Agent 실습 (8.ai-agent-40h)</span>
    <span><span class="tag ros">ROS</span> ROS 실습 (llm_Agent → 자율주행)</span>
    <span><span class="tag rev">복습</span> 일요일 따라잡기</span>
    <span>↗ 누르면 실습 파일이 열려요 (PDF·교재 HTML은 브라우저, .md·.py는 VS Code)</span>
  </div>
  <div id="list"></div>
</div>
<script src="english/lessons.js"></script>
<script>

  "1-4 실습: 첫 LLM 호출 (config.py)", "1-5 이론: LangChain 기초", "1-6 실습: 요약·답변 초안 체인 (draft.py)",
  "2-1 실습: 문의 자동 분류 (classify.py)", "2-2 이론: RAG", "2-3 실습: 사내 문서 Q&A (rag.py)",
  "2-4 이론: LangGraph ① 업무 흐름도", "3-1 이론: LangGraph ② 에이전트 설계", "3-2 실습: CS 에이전트 (tools.py, agent.py)",
  "3-3 이론: GraphRAG", "3-4 실습: 제품 지식그래프", "4-1 실습: Neo4j와 에이전트 연결",
  "4-2 이론: n8n 업무 자동화", "4-3 실습: n8n 문의 접수 자동화 (api.py)", "4-4 이론: Dify 노코드 AI 앱",
  "5-1 실습: Dify 고객 챗봇 공개", "5-3 실습: 통합·배포·포트폴리오 (5-2 이론 포함)",
  // 교재 끝나면 contest_mail_agent
  "contest_mail_agent ①: README·AGENTS.md·PLAN.md 읽기, 설치, <code>python main.py --offline --today 2026-11-02</code>",
  "contest_mail_agent ②: state.py·rules.py 읽기, <code>python evals/run_evals.py</code> 로 하네스 ON/OFF 비교",
  "contest_mail_agent ③: tools.py·nodes.py·graph.py — 조건부 엣지 2개와 승인 전 interrupt 이해",
  "contest_mail_agent ④: Tavily 키로 실제 검색 + 미리보기, skills/source-intake 절차로 소스 추가",
  "contest_mail_agent ⑤: Gmail 앱 비밀번호로 실제 발송(승인 y), checklist.md 체크",

// 실습 파일 열기: PDF·HTML 은 브라우저로, .md·.py 는 VS Code 로 연다
const AI_DIR = "C:/Users/jiyjj/OneDrive/바탕 화면/Visol_KUKBI/jiy/8.ai-agent-40h/";
const ROS_DIR = "C:/VISOL-FINAL/";
const fileUrl = (p, hash = "") => "file:///" + encodeURI(p) + hash;
const vscode = p => "vscode://file/" + encodeURI(p);
const AI_FILES = [
  "1일차/1-1_이론_오리엔테이션과_무료도구.md", "1일차/1-2_실습_개발환경_설정.md", "1일차/1-3_이론_생성형AI와_LLM_기초.md",
  "1일차/1-4_실습_첫_LLM_호출.md", "1일차/1-5_이론_LangChain_기초.md", "1일차/1-6_실습_LangChain_답변초안_체인.md",
  "2일차/2-1_실습_LangChain_문의자동분류.md", "2일차/2-2_이론_RAG.md", "2일차/2-3_실습_RAG_사내문서QA.md",
  "2일차/2-4_이론_LangGraph_1_업무흐름도.md", "3일차/3-1_이론_LangGraph_2_에이전트설계.md", "3일차/3-2_실습_LangGraph_CS에이전트.md",
  "3일차/3-3_이론_GraphRAG.md", "3일차/3-4_실습_GraphRAG_1_제품지식그래프.md", "4일차/4-1_실습_GraphRAG_2_Neo4j와_에이전트연결.md",
  "4일차/4-2_이론_n8n_업무자동화.md", "4일차/4-3_실습_n8n_문의접수자동화.md", "4일차/4-4_이론_Dify_노코드AI앱.md",
  "5일차/5-1_실습_Dify_고객챗봇공개.md", ["5일차/5-2_이론_배포_품질_포트폴리오.md", "5일차/5-3_실습_통합_배포_포트폴리오_발표.md"],
].map(f => [f].flat().map(x => [x.split("/")[1].split("_")[0], vscode(AI_DIR + "AI_Agent_실습교재/" + x)]))
 .concat([
  ["README.md", "AGENTS.md", "PLAN.md"], ["agent/state.py", "agent/rules.py", "evals/run_evals.py"],
  ["agent/tools.py", "agent/nodes.py", "agent/graph.py"], ["skills/source-intake/SKILL.md", "agent/tools.py"],
  ["checklist.md", "README.md"],
].map(fs => fs.map(f => [f.split("/").pop(), vscode(AI_DIR + "contest_mail_agent/" + f)])));
const RP_PDF = ROS_DIR + "llm_Agent,ros/ROS2_실전편_핸드아웃_A4흑백.pdf";
const RM_PDF = ROS_DIR + "llm_Agent,ros/AMR_Agent_Mission_Manager_실습.pdf";
const LIFT_HTML = n => ROS_DIR + `자율주행,ros/AMR_AI_Agent_handouts_v3/day${String(n).padStart(2, "0")}.html`;
const pdf = (f, page) => [`p.${page}`, fileUrl(f, `#page=${page}`)];
// 자율주행 교재 일차별 ① 이론 / ② 실습 섹션 id
const LIFT_LAB = [
  "리눅스와-ros-2-를-설치하고-노드끼리-대화시키기", "프로젝트-환경을-만들고-로봇-센서를-읽는다", "움직이고-멈추고-보고하는-로봇",
  "action-과-한-줄-기동-그리고-기록", "로봇의-눈과-귀를-숫자로-읽기", "지도를-그리고-맞추고-검수한다",
  "로봇이-무엇이-어디에-있는지-기억하게-하기", "가상-물류센터를-만들고-바꾸기", "한-줄로-켜고-이름으로-보내고-숫자로-비교한다",
  "협로를-지나고-금지구역을-피하고-어떤-경우에도-멈춘다", "작업을-단계로-바꾸고-조건에-따라-길을-고른다", "실패해도-멈추고-알리고-다시-하는-로봇",
  "말로-지시하면-작업이-된다", "a-사람-앞-감속정지-로봇-1대", "1층-s1-에서-2층-d1-까지-사람-손-없이",
];

// ROS: llm_Agent,ros 의 ROS2 실전편 → 자율주행,ros 15일 과정 (Mission Manager 는 Nav2 를 배운 9일차 뒤에)
// 자율주행 교재 하루치는 이틀에 나눠서 한다
const RP = "llm_Agent,ros · ROS2_실전편", RA = "자율주행,ros · AMR_AI_Agent_handouts_v3", RM = "llm_Agent,ros · AMR_Agent_Mission_Manager";
const LIFT = [
  "1일차 AMR 구조와 ROS 2 설치", "2일차 프로젝트 시작과 센서 관찰 (M0)", "3일차 Topic·Service 와 로봇 뼈대",
  "4일차 Action·Launch·기록 (M1)", "5일차 센서 데이터 처리와 시각화", "6일차 SLAM 운영 맵과 검수 (M2)",
  "7일차 Vision SLAM 과 시맨틱 맵", "8일차 Gazebo 월드·AMR 모델", "9일차 Nav2 운영 — 이름 이동과 성능 측정 (M3)",
  "10일차 협로 튜닝·금지구역·이중 안전", "11일차 작업 계획과 조건 기반 경로 선택", "12일차 임무 상태 기계와 작업 실행기 (M4)",
  "13일차 LLM AI Agent 와 산업 Task 흐름", "14일차 PDE 와 다중 AMR 교통 제어 (M5)", "15일차 엘리베이터 연동과 층간 이송 완성 (M6)",
];
const split = t => {
  const n = LIFT.indexOf(t) + 1;
  return [[`${t} ① 이론·실습 준비`, RA, [["교재 1. 이론", fileUrl(LIFT_HTML(n), "#1-이론")]]],
          [`${t} ② 실습·정리`, RA, [["교재 3. 실습", fileUrl(LIFT_HTML(n), "#" + encodeURIComponent("3-실습-" + LIFT_LAB[n - 1]))]]]];
};
const ROS = [
  ["1단원 환경 다지기(ros_env.sh, r2r_ws) + 실습 2-1·2-2 카메라·img_publisher", RP, [pdf(RP_PDF, 6)]],
  ["실습 2-3 YAML 파라미터·launch + 2-4 HSV 변환기", RP, [pdf(RP_PDF, 18)]],
  ["실습 2-5 Canny + 2-6 만화 필터 + 2-7 광학 흐름", RP, [pdf(RP_PDF, 23)]],
  ["3단원 TF 원리 + 실습 3-1·3-2·3-3 프레임 브로드캐스트", RP, [pdf(RP_PDF, 31)]],
  ["실습 3-4 TF 리스너 거리 + 3-5 RViz Marker·Path", RP, [pdf(RP_PDF, 40)]],
  ["4단원 도메인 ID + 실습 4-1·4-2", RP, [pdf(RP_PDF, 46)]],
  ["실습 4-3 로봇 2대 제어 + 4-4 domain_bridge", RP, [pdf(RP_PDF, 50)]],
  ["5단원 PID 원리 + 실습 5-1·5-2 회전 PID 튜닝", RP, [pdf(RP_PDF, 56)]],
  ["실습 5-3 PID 두 개로 위치 이동 + 5-4 마우스 지시", RP, [pdf(RP_PDF, 64)]],
  ["실습 5-5 상태 기계 (회전 → 직진 → 최종 자세)", RP, [pdf(RP_PDF, 70)]],
  ["6단원 라즈베리 파이 연동 (없으면 6-4 가상 센서만)", RP, [pdf(RP_PDF, 76)]],
  ...LIFT.slice(0, 9).flatMap(split),
  ["Mission Manager ①: 서비스·액션 원리 + 실습 1 인터페이스 패키지", RM, [pdf(RM_PDF, 2), pdf(RM_PDF, 5)]],
  ["Mission Manager ②: 실습 2 노드 작성 + 실습 3 동작 확인", RM, [pdf(RM_PDF, 7), pdf(RM_PDF, 12)]],
  ...LIFT.slice(9).flatMap(split),
];
// 매일 공부: 월~토 진도, 일요일은 밀린 것·복습
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const days = [];
for (let d = new Date(2026, 9, 29, 12), n = 0; n < Math.max(AI.length, ROS.length, EN_LESSONS.length); d.setDate(d.getDate() + 1)) {
  days.push(d.getDay() === 0 ? { date: new Date(d), buffer: true }
    : { date: new Date(d), ai: AI[n], aiFiles: AI_FILES[n], ros: ROS[n], lesson: EN_LESSONS[n++] });
}
document.getElementById("range").textContent =
  `${ymd(days[0].date)} ~ ${ymd(days[days.length - 1].date)} · 매일 공부, 일요일은 밀린 것·복습`;

const KEY = "study-wbs-v2";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const fmt = d => `${d.getMonth()+1}/${d.getDate()} (${"일월화수목금토"[d.getDay()]})`;
const today = ymd(new Date());

const list = document.getElementById("list");
function openLinks(ls) {
  return (ls || []).map(([t, u]) => ` <a class="open" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("");
}
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function lessonHtml(l) {
  return `<details class="lesson"><summary>오늘 영어 펼치기</summary>
    <h4>① 영상 10분</h4><a href="${BBC + l.v}" target="_blank" rel="noopener">BBC Real Easy English — ${esc(l.vt)}</a>
    <h4>② 표현 5개</h4><table>${l.w.map(([w, m, e]) => `<tr><td>${esc(w)}</td><td>${esc(m)}</td><td>${esc(e)}</td></tr>`).join("")}</table>
    <h4>③ 대화문 (소리 내어 읽기)</h4><div class="dialog">${esc(l.r)}</div>
    <h4>④ 확인문제</h4>${l.q.map(([q, opts, ans], k) => `<div class="quiz">${k + 1}. ${esc(q)}<br>${
      opts.map((o, j) => `<button data-ok="${j === ans}">${esc(o)}</button>`).join("")}</div>`).join("")}
    <h4>⑤ 말하기·쓰기 3문장</h4><div>${esc(l.wr)}</div></details>`;
}
function reviewHtml(ls) {
  return `<details class="lesson"><summary>이번 주 표현 펼치기 (줄을 누르면 뜻이 보여요)</summary><table>${
    ls.flatMap(l => l.w).map(([w, m]) => `<tr class="flip"><td>${esc(w)}</td><td>${esc(m)}</td></tr>`).join("")}</table>
    <h4>이번 주 확인문제 다시 풀기</h4>${ls.flatMap(l => l.q).map(([q, opts, ans], k) => `<div class="quiz">${k + 1}. ${esc(q)}<br>${
      opts.map((o, j) => `<button data-ok="${j === ans}">${esc(o)}</button>`).join("")}</div>`).join("")}</details>`;
}
list.addEventListener("click", e => {
  const b = e.target.closest(".quiz button");
  if (b) { b.classList.add(b.dataset.ok === "true" ? "ok" : "no"); return; }
  const r = e.target.closest(".flip");
  if (r) r.classList.toggle("show");
});

let weekEl, w = -1, weekLessons = [];
days.forEach(({ date, buffer, ai, aiFiles, ros, lesson }, i) => {
  if (!weekEl || date.getDay() === 1) {
    w++;
    weekEl = document.createElement("section");
    weekEl.className = "week";
    weekEl.innerHTML = `<h2>${w + 1}주차 · ${fmt(date)} ~</h2>`;
    list.appendChild(weekEl);
  }
  if (lesson) weekLessons.push(lesson);
  const review = buffer ? weekLessons.splice(0) : [];
  const tasks = [
    lesson && ["en", "EN", `생활영어 30분 — ${lesson.t}`, lessonHtml(lesson)],
    buffer && review.length && ["en", "EN", `생활영어 복습 — 이번 주 표현 ${review.length * 5}개 다시 보기`, reviewHtml(review)],
    buffer && ["rev", "복습", "새 진도 없음 — 이번 주 밀린 것 따라잡기, 막힌 부분 다시 보기"],
    ai && ["ai", "AI", `${ai} <small>· ${AI.indexOf(ai) < 20 ? "AI_Agent_실습교재" : "contest_mail_agent"}</small>${openLinks(aiFiles)}`],
    ros && ["ros", "ROS", `${ros[0]} <small>· ${ros[1]}</small>${openLinks(ros[2])}`],
  ].filter(Boolean);
  const el = document.createElement("div");
  el.className = "day" + (buffer ? " buffer" : "") + (ymd(date) === today ? " today" : "");
  el.innerHTML = `<header>${fmt(date)}<span>${buffer ? "복습일" : ""}</span></header>` + tasks.map(([c, t, txt, more]) => {
    const id = `${ymd(date)}-${c}`;
    return `<label class="${state[id] ? "done" : ""}"><input type="checkbox" data-id="${id}" ${state[id] ? "checked" : ""}>
      <span class="txt"><span class="tag ${c}">${t}</span> ${txt}</span></label>${more || ""}`;
  }).join("");
  weekEl.appendChild(el);
});

function update() {
  const boxes = [...document.querySelectorAll("input[type=checkbox]")];
  const n = boxes.filter(b => b.checked).length;
  const p = Math.round(n / boxes.length * 100);
  document.getElementById("pct").textContent = `${p}% (${n}/${boxes.length})`;
  document.getElementById("fill").style.width = p + "%";
}
list.addEventListener("change", e => {
  const b = e.target; if (!b.dataset.id) return;
  state[b.dataset.id] = b.checked; save();
  b.closest("label").classList.toggle("done", b.checked);
  update();
});
update();
document.querySelector(".today")?.scrollIntoView({ block: "center" });
</script>
</body>
</html>
